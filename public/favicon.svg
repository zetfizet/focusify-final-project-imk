<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Center circle (focus point) -->
  <circle cx="24" cy="24" r="6" fill="#A8D5BA"/>
  
  <!-- Outer rings (concentration layers) -->
  <circle cx="24" cy="24" r="12" stroke="#A8D5BA" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="24" cy="24" r="18" stroke="#A8D5BA" stroke-width="1.5" fill="none" opacity="0.3"/>
  
  <!-- Focus rays (4 directions) -->
  <line x1="24" y1="4" x2="24" y2="8" stroke="#7FB069" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="44" y2="24" stroke="#7FB069" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="24" y2="44" stroke="#7FB069" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="24" x2="8" y2="24" stroke="#7FB069" stroke-width="2" stroke-linecap="round"/>
</svg>